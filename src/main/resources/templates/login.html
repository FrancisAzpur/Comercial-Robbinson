<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head('Login')}"></head>

<body>

    <!-- Header -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- Margen para navbar fija -->
    <div style="margin-top: 70px;">

        <!-- CONTENIDO LOGIN -->
        <section class="container d-flex justify-content-center align-items-center my-5 p-4 rounded" style="background:#f4f1ee;">
            <div class="col-md-5 col-lg-4">

                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-header text-center" style="background:#f1f3f5; color:#1f2937;">
                        <h5 class="fw-bold mb-0">Iniciar Sesión</h5>
                    </div>

                    <div class="card-body p-5">
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email"
                                       class="form-control"
                                       placeholder="correo@ejemplo.com"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password"
                                       class="form-control"
                                       placeholder="••••••••"
                                       required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Ingresar
                            </button>
                        </form>
                    </div>

                    <div class="card-footer text-center">
                        <span class="me-1">¿No tienes cuenta?</span>
                        <a th:href="@{/registro}" class="fw-semibold">
                            Regístrate
                        </a>
                    </div>
                </div>

            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/footer :: scripts}"></div>

</body>
</html>
