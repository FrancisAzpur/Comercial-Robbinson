<!--
=========================================================================
PÁGINA DE LOGIN - login.html
=========================================================================
PUNTO DE EVALUACIÓN: Autenticación + Thymeleaf + Bootstrap

THYMELEAF:
  th:replace="~{fragments/header :: head('Login')}" → Incluye header fragment
  th:action="@{/login}" method="POST"  → Envía credenciales al controlador
  th:if="${mensajeError}"              → Muestra error de autenticación
  th:if="${mensajeExito}"              → Muestra mensaje de registro exitoso

FLUJO: El POST /login lo procesa HomeController.procesarLogin()
  que valida contra la BD usando ClienteService.autenticar()
  y crea la sesión HTTP con session.setAttribute("clienteLogueado", ...)
=========================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Incluye el fragment 'head' con título 'Login' -->
<head th:replace="~{fragments/header :: head('Login')}"></head>

<body>

    <!-- Header -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- Margen para navbar fija -->
    <div style="margin-top: 70px;">

        <!-- CONTENIDO LOGIN -->
        <section class="container d-flex justify-content-center align-items-center my-5 p-4 rounded" style="background:#f4f1ee;">
            <div class="col-md-5 col-lg-4">

                <!-- Mensaje de éxito (ej: registro exitoso) -->
                <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${mensajeExito}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Mensaje de error -->
                <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${mensajeError}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-header text-center" style="background:#f1f3f5; color:#1f2937;">
                        <h5 class="fw-bold mb-0">Iniciar Sesión</h5>
                    </div>

                    <div class="card-body p-5">
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" id="correo" name="correo"
                                       class="form-control"
                                       placeholder="correo@ejemplo.com"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <input type="password" id="contrasena" name="contrasena"
                                       class="form-control"
                                       placeholder="••••••••"
                                       required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-sign-in-alt me-2"></i>Ingresar
                            </button>
                        </form>
                    </div>

                    <div class="card-footer text-center">
                        <span class="me-1">¿No tienes cuenta?</span>
                        <a th:href="@{/registro}" class="fw-semibold">
                            Regístrate
                        </a>
                    </div>
                    <!-- enlace para recuperar contraseña -->
                    <div class="text-center mt-2">
                        <a th:href="@{/recuperar}" class="small">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>

            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/footer :: scripts}"></div>

</body>
</html>
