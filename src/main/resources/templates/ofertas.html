<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head('Ofertas Especiales')}">
</head>

<body>
    <!-- Header -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- Margen superior para navbar fija -->
    <div style="margin-top: 70px;">

        <!-- Sección de Ofertas -->
        <section class="py-5" style="background-color: #f8f9fa;">
            <div class="container">
                <!-- Título -->
                <div class="text-center mb-5">
                    <h1 class="display-4 fw-bold text-primary">🔥 OFERTAS ESPECIALES</h1>
                    <p class="lead text-muted">Aprovecha nuestras promociones exclusivas con descuentos increíbles</p>
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="alert alert-warning d-flex align-items-center" role="alert">
                                <i class="bi bi-stopwatch me-2"></i>
                                <div>
                                    ¡Ofertas por tiempo limitado! No te quedes sin tus productos favoritos.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contador de items en carrito -->
                <div class="d-flex justify-content-end mb-4">
                    <button class="btn btn-primary position-relative" data-bs-toggle="modal"
                        data-bs-target="#carritoModal">
                        <i class="bi bi-cart3"></i> Mi Carrito
                        <span th:if="${totalItems > 0}"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            <span th:text="${totalItems}"></span>
                            <span class="visually-hidden">items en carrito</span>
                        </span>
                    </button>
                </div>

                <!-- Grid de Productos en Oferta -->
                <div class="row g-4">
                    <div th:each="producto : ${productosOferta}" class="col-md-6 col-lg-4 col-xl-3">
                        <div class="card h-100 shadow-sm border-0 hover-shadow">
                            <!-- Badge de Oferta -->
                            <div class="position-absolute top-0 start-0 m-2">
                                <span class="badge bg-danger fs-6">
                                    -<span th:text="${producto.getPorcentajeDescuento()}"></span>%
                                </span>
                            </div>

                            <!-- Imagen del Producto -->
                            <img th:src="@{${producto.imagen}}" th:alt="${producto.nombre}" class="card-img-top p-3"
                                style="height: 200px; object-fit: contain;">

                            <div class="card-body d-flex flex-column">
                                <!-- Categoría -->
                                <div class="mb-2">
                                    <span class="badge" th:class="${producto.categoria == 'Electrodomésticos'} ? 
                                               'bg-info' : 'bg-success'" th:text="${producto.categoria}">
                                    </span>
                                </div>

                                <!-- Nombre y Descripción -->
                                <h5 class="card-title text-primary" th:text="${producto.nombre}"></h5>
                                <p class="card-text text-muted small" th:text="${producto.descripcion}"></p>

                                <!-- Precios -->
                                <div class="mt-auto">
                                    <div class="d-flex align-items-center mb-2">
                                        <h4 class="text-danger fw-bold mb-0"
                                            th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2, 'COMMA')}">
                                        </h4>
                                        <small class="text-muted text-decoration-line-through ms-2"
                                            th:if="${producto.tieneDescuento()}"
                                            th:text="'$' + ${#numbers.formatDecimal(producto.precioAnterior, 1, 2, 'COMMA')}">
                                        </small>
                                    </div>

                                    <!-- Stock -->
                                    <div class="mb-3">
                                        <small class="text-muted">
                                            <i class="bi bi-box"></i>
                                            <span th:text="'Stock: ' + ${producto.stock}"></span>
                                        </small>
                                    </div>

                                    <!-- Botón Agregar al Carrito -->
                                    <button class="btn btn-outline-primary w-100"
                                        th:onclick="'agregarAlCarrito(' + ${producto.id} + ')'">
                                        <i class="bi bi-cart-plus"></i> Agregar al Carrito
                                    </button>

                                    <!-- Botón Ver Detalles -->
                                    <button class="btn btn-link text-decoration-none w-100 mt-2" data-bs-toggle="modal"
                                        data-bs-target="#detalleProductoModal"
                                        th:onclick="'cargarDetalleProducto(' + ${producto.id} + ')'">
                                        <i class="bi bi-eye"></i> Ver Detalles
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Banner Informativo -->
                <div class="row mt-5">
                    <div class="col-12">
                        <div class="alert alert-info">
                            <div class="row align-items-center">
                                <div class="col-md-9">
                                    <h5 class="alert-heading">🚚 Envío Gratis</h5>
                                    <p class="mb-0">En compras mayores a $500. ¡Aprovecha esta oferta especial!</p>
                                </div>
                                <div class="col-md-3 text-end">
                                    <span class="fs-1">📦</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>

        <!-- Modal Carrito -->
        <div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="carritoModalLabel">
                            <i class="bi bi-cart3"></i> Tu Carrito de Compras
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="carritoContent">
                        <!-- Contenido cargado dinámicamente -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Detalle Producto -->
        <div class="modal fade" id="detalleProductoModal" tabindex="-1" aria-labelledby="detalleProductoModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="detalleProductoModalLabel">Detalles del Producto</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="detalleProductoContent">
                        <!-- Contenido cargado dinámicamente -->
                    </div>
                </div>
            </div>
        </div>

    </div> <!-- Fin del margen superior -->

    <!-- Scripts -->
    <script th:inline="javascript">
        /*<![CDATA[*/

        // Función para agregar producto al carrito
        function agregarAlCarrito(productoId) {
            fetch('/ofertas/agregar-carrito', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'productoId=' + productoId + '&cantidad=1'
            })
                .then(response => response.text())
                .then(data => {
                    actualizarCarrito();
                    mostrarNotificacion('Producto agregado al carrito', 'success');
                })
                .catch(error => {
                    console.error('Error:', error);
                    mostrarNotificacion('Error al agregar producto', 'danger');
                });
        }

        // Función para actualizar el carrito
        function actualizarCarrito() {
            fetch('/ofertas/carrito')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('carritoContent').innerHTML = html;
                });
        }

        // Función para cargar detalle del producto
        function cargarDetalleProducto(productoId) {
            fetch('/ofertas/detalle-producto/' + productoId)
                .then(response => response.text())
                .then(html => {
                    document.getElementById('detalleProductoContent').innerHTML = html;
                });
        }

        // Función para mostrar notificaciones
        function mostrarNotificacion(mensaje, tipo) {
            const alerta = document.createElement('div');
            alerta.className = `alert alert-${tipo} alert-dismissible fade show position-fixed top-0 end-0 m-3`;
            alerta.style.zIndex = '1056';
            alerta.innerHTML = `
                ${mensaje}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alerta);

            setTimeout(() => {
                alerta.remove();
            }, 3000);
        }

        // Actualizar carrito al cargar la página
        document.addEventListener('DOMContentLoaded', function () {
            actualizarCarrito();

            // Mostrar carrito cuando se hace clic en el botón
            const carritoModal = document.getElementById('carritoModal');
            if (carritoModal) {
                carritoModal.addEventListener('show.bs.modal', actualizarCarrito);
            }
        });
        /*]]>*/
    </script>
</body>

</html>
