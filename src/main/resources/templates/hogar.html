<!--
=========================================================================
CATÁLOGO HOGAR - hogar.html
=========================================================================
PUNTO DE EVALUACIÓN: Consultas a BD + Thymeleaf iteration + Bootstrap

THYMELEAF: th:each para iterar productos, th:text, th:src
BOOTSTRAP: cards, grid, buttons
Datos cargados desde ProductoService.obtenerProductosActivos()
=========================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Hogar')}"></head>

<body>
    <!-- Header -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- Margen superior para navbar fija -->
    <div style="margin-top: 70px;">
    

<!-- CONTENIDO HOGAR -->
<section class="container-fluid mt-5 pt-5">
    <div class="row">

        <!-- SIDEBAR -->
        <aside class="col-md-3 col-lg-2 border-end p-4">
            <h5 class="fw-bold mb-4">Hogar</h5>

            <div class="mb-4">
                <h6 class="fw-semibold mb-2">Categorías</h6>
                <ul class="list-unstyled category-list">
                    <li><button class="category-btn active" data-filter="todos">Todos</button></li>
                    <li><button class="category-btn" data-filter="menaje">Menaje</button></li>
                    <li><button class="category-btn" data-filter="cocina">Cocina</button></li>
                    <li><button class="category-btn" data-filter="decoracion">Decoración</button></li>
                    <li><button class="category-btn" data-filter="organizacion">Organización</button></li>
                    <li><button class="category-btn" data-filter="muebles">Muebles</button></li>
                </ul>

            </div>
        </aside>

        <!-- PRODUCTOS -->
        <main class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold">Productos del hogar</h4>
                <select id="sortSelect" class="form-select w-auto">
                    <option value="relevancia">Relevancia</option>
                    <option value="menor-precio">Menor precio</option>
                    <option value="mayor-precio">Mayor precio</option>
                </select>
            </div>

            <div class="row g-4">
                <!-- Productos cargados dinámicamente desde hogar.js -->
            </div>
        </main>

    </div>
</section>

    </div>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/footer :: scripts}"></div>
    
    <!-- Script específico de hogar -->
    <script th:src="@{/js/hogar.js}"></script>
</body>
</html>
