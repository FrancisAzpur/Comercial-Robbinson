<!--
=========================================================================
FRAGMENTO HEADER - Cabecera reutilizable con Thymeleaf Fragments
=========================================================================
PUNTO DE EVALUACIÓN: Menús + Bootstrap 5.3.3 + Comandos Thymeleaf

COMANDOS THYMELEAF UTILIZADOS:
  th:fragment="head(titulo)"  → Define fragmento reutilizable con parámetro
  th:fragment="header"        → Define fragmento del navbar
  th:text="${titulo}"         → Muestra el título dinámico de cada página
  th:href="@{/css/global.css}"→ Genera URL relativa al contexto de la app
  th:if / th:unless           → Renderizado condicional
  th:if="${session.clienteLogueado == null}" → Verifica sesión HTTP
  th:text="${session.nombreCliente}"  → Muestra nombre del usuario logueado

BOOTSTRAP 5.3.3:
  - navbar navbar-expand-lg   → Navbar responsive
  - collapse navbar-collapse  → Menú colapsable en móvil
  - dropdown dropdown-toggle  → Menú desplegable del usuario
  - badge bg-danger           → Badge del carrito

MENÚ PRINCIPAL:
  Inicio | Electrodomésticos | Hogar | Ofertas | Contacto | Carrito | Login
  Si está logueado: Dropdown con Dashboard, Panel Admin, Cerrar Sesión
=========================================================================
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- FRAGMENTO HEAD: se incluye en cada página con th:replace="~{fragments/header :: head('Titulo')}" -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Comercial Robinson'">Comercial Robinson</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- AOS para animaciones al scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Estilos Globales Unificados -->
    <link th:href="@{/css/global.css}" rel="stylesheet">
    
    <!-- CSS específicos por página -->
    <link th:if="${titulo == 'Inicio'}" th:href="@{/css/index.css}" rel="stylesheet">
    <link th:if="${titulo == 'Electrodomésticos'}" th:href="@{/css/electrodomesticos.css}" rel="stylesheet">
    <link th:if="${titulo == 'Hogar'}" th:href="@{/css/hogar.css}" rel="stylesheet">
    <link th:if="${titulo == 'Ofertas'}" th:href="@{/css/ofertas.css}" rel="stylesheet">
    <link th:if="${titulo == 'Contacto'}" th:href="@{/css/contacto.css}" rel="stylesheet">
    <link th:if="${titulo == 'Mi Carrito'}" th:href="@{/css/carrito.css}" rel="stylesheet">
    <link th:if="${titulo == 'Panel de Operarios'}" th:href="@{/css/admin.css}" rel="stylesheet">
    <link th:if="${titulo == 'Login'}" th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>
    <!-- Header/Navbar Fragment -->
    <nav th:fragment="header" class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-store me-2"></i>
                <strong>Comercial Robinson</strong>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-home me-1"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/electrodomesticos}">
                            <i class="fas fa-blender me-1"></i> Electrodomésticos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/hogar}">
                            <i class="fas fa-couch me-1"></i> Hogar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/ofertas}">
                            <i class="fas fa-tags me-1"></i> Ofertas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/contacto}">
                            <i class="fas fa-envelope me-1"></i> Contacto
                        </a>
                    </li>
                    <li class="nav-item ms-2">
                        <a class="nav-link cart-icon" th:href="@{/carrito}">
                            <i class="fas fa-shopping-cart"></i>
                            <span class="badge bg-danger cart-count">0</span>
                        </a>
                    </li>

                    <!-- Si NO hay sesión activa: mostrar Login -->
                    <li class="nav-item" th:if="${session.clienteLogueado == null}">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt me-1"></i> Login
                        </a>
                    </li>

                    <!-- Si HAY sesión activa: mostrar nombre + dropdown -->
                    <li class="nav-item dropdown" th:if="${session.clienteLogueado != null}">
                        <a class="nav-link dropdown-toggle" href="#" role="button" 
                           data-bs-toggle="dropdown" aria-expanded="false" 
                           style="color: #e07a5f; font-weight: 600;">
                            <i class="fas fa-user-circle me-1"></i>
                            <span th:text="${session.nombreCliente}">Usuario</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" th:href="@{/gestion/dashboard}">
                                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/admin}">
                                    <i class="fas fa-cogs me-2"></i>Panel Admin
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item text-danger" th:href="@{/logout}">
                                    <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                                </a>
                            </li>
                        </ul>
                    </li>


                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
