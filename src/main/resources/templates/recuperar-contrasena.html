<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head('Recuperar Contraseña')}"></head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>
    <div style="margin-top: 70px;">
        <section class="container d-flex justify-content-center align-items-center my-5 p-4 rounded" style="background:#f4f1ee;">
            <div class="col-md-5 col-lg-4">
                <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${mensajeExito}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${mensajeError}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-header text-center" style="background:#f1f3f5; color:#1f2937;">
                        <h5 class="fw-bold mb-0">Recuperar Contraseña</h5>
                    </div>
                    <div class="card-body p-5">
                        <form th:action="@{/recuperar}" method="post">
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" id="correo" name="correo" class="form-control" placeholder="correo@ejemplo.com" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                Enviar instrucciones
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <a th:href="@{/login}" class="fw-semibold">Volver al login</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
