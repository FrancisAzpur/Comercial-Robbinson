<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Detalle Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .detail-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        .detail-label {
            font-weight: 600;
            color: var(--dark-blue);
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/pedidos">
                            <i class="fas fa-arrow-left me-1"></i>Volver al Listado
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1 class="fw-bold mb-4" style="color: #8d5524;">
                    <i class="fas fa-shopping-cart me-2"></i>Detalle del Pedido
                </h1>

                <div class="detail-card">
                    <div class="row mb-3">
                        <div class="col-md-4"><span class="detail-label">Nº Pedido:</span></div>
                        <div class="col-md-8"><span th:text="${pedido.numeroPedido}"></span></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><span class="detail-label">Cliente:</span></div>
                        <div class="col-md-8">
                            <span th:text="${pedido.cliente != null ? pedido.cliente.nombreCompleto : 'Sin cliente'}"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><span class="detail-label">Fecha Pedido:</span></div>
                        <div class="col-md-8">
                            <span th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><span class="detail-label">Subtotal:</span></div>
                        <div class="col-md-8">S/. <span th:text="${#numbers.formatDecimal(pedido.subtotal, 1, 2, true)}"></span></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><span class="detail-label">Impuesto (18%):</span></div>
                        <div class="col-md-8">S/. <span th:text="${#numbers.formatDecimal(pedido.impuesto, 1, 2, true)}"></span></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><span class="detail-label">Costo Envío:</span></div>
                        <div class="col-md-8">S/. <span th:text="${#numbers.formatDecimal(pedido.costoEnvio, 1, 2, true)}"></span></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><span class="detail-label">Total:</span></div>
                        <div class="col-md-8"><strong>S/. <span th:text="${#numbers.formatDecimal(pedido.total, 1, 2, true)}"></span></strong></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><span class="detail-label">Estado:</span></div>
                        <div class="col-md-8">
                            <span th:class="'badge badge-' + ${pedido.estado}" th:text="${pedido.estado}"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><span class="detail-label">Método de Pago:</span></div>
                        <div class="col-md-8"><span th:text="${pedido.metodoPago}"></span></div>
                    </div>

                    <div class="row mb-3" th:if="${pedido.observaciones}">
                        <div class="col-md-4"><span class="detail-label">Observaciones:</span></div>
                        <div class="col-md-8"><span th:text="${pedido.observaciones}"></span></div>
                    </div>

                    <!-- Cambiar estado del pedido -->
                    <hr>
                    <h5 class="mb-3">Cambiar Estado</h5>
                    <form th:action="@{/gestion/pedidos/{id}/cambiar-estado(id=${pedido.idPedido})}" method="POST" class="d-flex gap-2">
                        <select name="estado" class="form-select" style="width: auto;">
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="PAGADO">Pagado</option>
                            <option value="PROCESANDO">Procesando</option>
                            <option value="ENVIADO">Enviado</option>
                            <option value="ENTREGADO">Entregado</option>
                            <option value="CANCELADO">Cancelado</option>
                        </select>
                        <button type="submit" class="btn btn-primary">Actualizar Estado</button>
                    </form>

                    <hr>
                    <div class="d-flex justify-content-between">
                        <a href="/gestion/pedidos" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Volver
                        </a>
                        <div>
                            <a th:href="@{/gestion/pedidos/{id}/editar(id=${pedido.idPedido})}" class="btn btn-warning">
                                <i class="fas fa-edit me-2"></i>Editar
                            </a>
                            <a th:href="@{/gestion/pedidos/{id}/eliminar(id=${pedido.idPedido})}" class="btn btn-danger"
                               onclick="return confirm('¿Estás seguro de eliminar este pedido?')">
                                <i class="fas fa-trash me-2"></i>Eliminar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
