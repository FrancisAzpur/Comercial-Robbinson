<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Dirección</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-primary:hover {
            background-color: #c95e4a;
        }
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/direcciones">
                            <i class="fas fa-arrow-left me-1"></i>Volver al Listado
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1 class="fw-bold mb-4" style="color: #8d5524;">
                    <i class="fas fa-map-marker-alt me-2"></i>
                    <span th:text="${titulo}">Formulario de Dirección</span>
                </h1>

                <div class="form-card">
                    <form th:action="@{/gestion/direcciones/guardar}" th:object="${direccion}" method="post">
                        
                        <!-- ID oculto para edición -->
                        <input type="hidden" th:field="*{idDireccion}">

                        <!-- Seleccionar Cliente -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Cliente *</label>
                            <select name="idCliente" class="form-select" required>
                                <option value="">Selecciona un cliente</option>
                                <option th:each="cliente : ${clientes}" 
                                        th:value="${cliente.idCliente}" 
                                        th:text="${cliente.nombreCompleto + ' (' + cliente.correoElectronico + ')'}"
                                        th:selected="${direccion.cliente != null and direccion.cliente.idCliente == cliente.idCliente}">
                                </option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Alias</label>
                                <input type="text" th:field="*{alias}" class="form-control" 
                                       placeholder="Ej: Casa, Trabajo, Oficina" maxlength="50">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Código Postal</label>
                                <input type="text" th:field="*{codigoPostal}" class="form-control" 
                                       placeholder="Ej: 15001" maxlength="10">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Dirección Completa *</label>
                            <input type="text" th:field="*{direccion}" class="form-control" 
                                   placeholder="Av. / Jr. / Calle, Número, Interior" required maxlength="255">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Referencia</label>
                            <input type="text" th:field="*{referencia}" class="form-control" 
                                   placeholder="Cerca de..., Frente a..." maxlength="255">
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">Distrito *</label>
                                <input type="text" th:field="*{distrito}" class="form-control" 
                                       placeholder="Ej: Miraflores" required maxlength="100">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">Provincia *</label>
                                <input type="text" th:field="*{provincia}" class="form-control" 
                                       placeholder="Ej: Lima" required maxlength="100">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">Departamento *</label>
                                <input type="text" th:field="*{departamento}" class="form-control" 
                                       placeholder="Ej: Lima" required maxlength="100">
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{esPrincipal}" id="esPrincipal">
                                <label class="form-check-label fw-semibold" for="esPrincipal">
                                    <i class="fas fa-star text-warning me-1"></i>Marcar como dirección principal
                                </label>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <a href="/gestion/direcciones" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>Guardar Dirección
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
