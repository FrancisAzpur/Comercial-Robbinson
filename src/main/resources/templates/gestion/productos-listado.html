<!--
=========================================================================
LISTADO DE PRODUCTOS - productos-listado.html
=========================================================================
PUNTO DE EVALUACIÓN: CRUD (Read/List) + Bootstrap table + Thymeleaf

COMANDOS THYMELEAF:
  th:each="producto : ${productos}"   → Itera todos los productos
  th:src="@{${producto.imagenPrincipal}}"→ Imagen dinámica del producto
  th:text="${#numbers.formatDecimal(producto.precioVenta, 1, 2, true)}" → Precio
  th:if="${producto.stockActual <= producto.stockMinimo}" → Alerta stock bajo
  th:class (condicional)              → Badge de estado activo/inactivo

BOOTSTRAP: table, badge, img-thumbnail, btn-outline-*, search form
=========================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.85) !important;
        }
        .nav-link:hover {
            color: var(--accent-orange) !important;
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-primary:hover {
            background-color: #c95e4a;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(224, 122, 95, 0.1);
        }
        .badge-activo { background-color: #28a745; }
        .badge-inactivo { background-color: #dc3545; }
        .badge-stock-bajo { background-color: #ffc107; color: #000; }
        .stock-bajo {
            color: #dc3545;
            font-weight: bold;
        }
        .producto-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/dashboard">
                            <i class="fas fa-chart-line me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/clientes">
                            <i class="fas fa-users me-1"></i>Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/pedidos">
                            <i class="fas fa-shopping-cart me-1"></i>Pedidos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/gestion/productos">
                            <i class="fas fa-boxes me-1"></i>Productos
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-5">
        <div class="row mb-4">
            <div class="col-md-6">
                <h1 class="fw-bold" style="color: #8d5524;">
                    <i class="fas fa-boxes me-2"></i>Gestión de Productos
                </h1>
                <p class="text-muted">Administra el catálogo de productos</p>
            </div>
            <div class="col-md-6 text-end">
                <a href="/gestion/productos/nuevo" class="btn btn-primary btn-lg">
                    <i class="fas fa-plus me-2"></i>Nuevo Producto
                </a>
            </div>
        </div>

        <!-- Formulario de búsqueda -->
        <div class="row mb-4">
            <div class="col-md-12">
                <form class="input-group input-group-lg" method="get" action="/gestion/productos/buscar">
                    <input type="text" name="nombre" class="form-control" placeholder="Buscar producto por nombre..." required>
                    <button class="btn btn-primary" type="submit">
                        <i class="fas fa-search me-1"></i>Buscar
                    </button>
                </form>
            </div>
        </div>

        <!-- Tabla de productos -->
        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-2"></i>Listado de Productos
                            <span class="badge bg-info float-end" th:text="'Total: ' + ${#lists.size(productos)}"></span>
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <div th:if="${productos.isEmpty()}" class="alert alert-warning m-3">
                            <i class="fas fa-info-circle me-2"></i>No hay productos registrados
                        </div>
                        
                        <table class="table table-hover mb-0" th:unless="${productos.isEmpty()}">
                            <thead class="table-light">
                                <tr>
                                    <th>Código</th>
                                    <th>Imagen</th>
                                    <th>Nombre</th>
                                    <th>P. Compra</th>
                                    <th>P. Venta</th>
                                    <th>Stock</th>
                                    <th>Etiqueta</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="producto : ${productos}">
                                    <td><strong th:text="${producto.codigoProducto}"></strong></td>
                                    <td>
                                        <img th:if="${producto.imagenPrincipal}" 
                                             th:src="${producto.imagenPrincipal}" 
                                             alt="Producto" class="producto-img">
                                        <span th:unless="${producto.imagenPrincipal}" class="text-muted">
                                            <i class="fas fa-image"></i>
                                        </span>
                                    </td>
                                    <td th:text="${producto.nombreProducto}"></td>
                                    <td>S/. <span th:text="${#numbers.formatDecimal(producto.precioCompra, 1, 2)}"></span></td>
                                    <td>S/. <span th:text="${#numbers.formatDecimal(producto.precioVenta, 1, 2)}"></span></td>
                                    <td>
                                        <span th:if="${producto.stockActual <= producto.stockMinimo}" class="stock-bajo">
                                            <i class="fas fa-exclamation-triangle"></i> 
                                            <span th:text="${producto.stockActual}"></span>
                                        </span>
                                        <span th:unless="${producto.stockActual <= producto.stockMinimo}" th:text="${producto.stockActual}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${producto.etiqueta}" class="badge bg-info" th:text="${producto.etiqueta}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${producto.activo}" class="badge badge-activo">Activo</span>
                                        <span th:unless="${producto.activo}" class="badge badge-inactivo">Inactivo</span>
                                    </td>
                                    <td>
                                        <a class="btn btn-sm btn-info" th:href="@{/gestion/productos/{id}(id=${producto.idProducto})}">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a class="btn btn-sm btn-warning" th:href="@{/gestion/productos/{id}/editar(id=${producto.idProducto})}">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a class="btn btn-sm btn-danger" th:href="@{/gestion/productos/{id}/eliminar(id=${producto.idProducto})}"
                                           onclick="return confirm('¿Eliminar este producto?')">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
