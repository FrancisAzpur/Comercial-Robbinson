<!--
=========================================================================
FORMULARIO DE PEDIDOS - pedidos-formulario.html
=========================================================================
PUNTO DE EVALUACIÓN: CRUD (Create/Update) + Listas desplegables + Bootstrap

COMANDOS THYMELEAF:
  th:object="${pedido}"           → Vincula el formulario al objeto Pedido
  th:action="@{/gestion/pedidos/guardar}" → URL de acción del formulario
  th:field="*{numeroPedido}"      → Binding bidireccional campo ↔ atributo
  th:each="cli : ${clientes}"     → Itera clientes para el <select>
  th:value="${cli.idCliente}"     → Valor de cada <option>
  th:text="${cli.nombreCompleto}" → Texto visible de cada <option>

LISTAS DESPLEGABLES (<select>) - MÍNIMO 2 PÁGINAS:
  1. Cliente:     th:each para cargar clientes activos desde la BD
  2. Método Pago: EFECTIVO, TARJETA_CREDITO, TARJETA_DEBITO, YAPE, PLIN
  3. Estado:      PENDIENTE, PAGADO, PROCESANDO, ENVIADO, ENTREGADO

BOOTSTRAP: form-control, form-select, btn-primary, row/col grid
=========================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: 600;
            color: var(--dark-blue);
        }
        .form-control:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 0.2rem rgba(224, 122, 95, 0.25);
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-primary:hover {
            background-color: #c95e4a;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/pedidos">
                            <i class="fas fa-arrow-left me-1"></i>Volver
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1 class="fw-bold mb-4" style="color: #8d5524;">
                    <i class="fas fa-shopping-cart me-2"></i><span th:text="${titulo}"></span>
                </h1>

                <div class="form-section">
                    <form th:action="${pedido.idPedido != null ? '/gestion/pedidos/' + pedido.idPedido + '/actualizar' : '/gestion/pedidos/guardar'}" 
                          method="POST" th:object="${pedido}">
                        
                        <div class="row">
                            <!-- Número de Pedido -->
                            <div class="col-md-6 mb-3">
                                <label for="numeroPedido" class="form-label">Número de Pedido</label>
                                <input type="text" class="form-control" id="numeroPedido" th:field="*{numeroPedido}" 
                                       placeholder="Se genera automáticamente">
                                <small class="text-muted">Deja vacío para generar automáticamente</small>
                            </div>

                            <!-- Cliente -->
                            <div class="col-md-6 mb-3">
                                <label for="cliente" class="form-label">Cliente <span class="text-danger">*</span></label>
                                <select class="form-select" id="cliente" th:field="*{cliente}" required>
                                    <option value="">Seleccionar cliente...</option>
                                    <option th:each="cli : ${clientes}" 
                                            th:value="${cli.idCliente}" 
                                            th:text="${cli.nombreCompleto}">Cliente</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Subtotal -->
                            <div class="col-md-4 mb-3">
                                <label for="subtotal" class="form-label">Subtotal (S/.) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="subtotal" th:field="*{subtotal}" 
                                       step="0.01" placeholder="0.00" required>
                            </div>

                            <!-- Costo Envío -->
                            <div class="col-md-4 mb-3">
                                <label for="costoEnvio" class="form-label">Costo Envío (S/.)</label>
                                <input type="number" class="form-control" id="costoEnvio" th:field="*{costoEnvio}" 
                                       step="0.01" placeholder="0.00">
                            </div>

                            <!-- Total -->
                            <div class="col-md-4 mb-3">
                                <label for="total" class="form-label">Total (S/.)</label>
                                <input type="number" class="form-control" id="total" th:field="*{total}" 
                                       step="0.01" placeholder="Se calcula automáticamente" readonly>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Estado del Pedido -->
                            <div class="col-md-6 mb-3">
                                <label for="estado" class="form-label">Estado <span class="text-danger">*</span></label>
                                <select class="form-select" id="estado" th:field="*{estado}" required>
                                    <option value="PENDIENTE">Pendiente</option>
                                    <option value="PAGADO">Pagado</option>
                                    <option value="PROCESANDO">Procesando</option>
                                    <option value="ENVIADO">Enviado</option>
                                    <option value="ENTREGADO">Entregado</option>
                                    <option value="CANCELADO">Cancelado</option>
                                </select>
                            </div>

                            <!-- Método de Pago -->
                            <div class="col-md-6 mb-3">
                                <label for="metodoPago" class="form-label">Método de Pago <span class="text-danger">*</span></label>
                                <select class="form-select" id="metodoPago" th:field="*{metodoPago}" required>
                                    <option value="EFECTIVO">Efectivo</option>
                                    <option value="TARJETA_CREDITO">Tarjeta de Crédito</option>
                                    <option value="TARJETA_DEBITO">Tarjeta de Débito</option>
                                    <option value="TRANSFERENCIA">Transferencia</option>
                                    <option value="YAPE">Yape</option>
                                    <option value="PLIN">Plin</option>
                                </select>
                            </div>
                        </div>

                        <!-- Observaciones -->
                        <div class="mb-3">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <textarea class="form-control" id="observaciones" th:field="*{observaciones}" 
                                      rows="3" placeholder="Notas adicionales del pedido..."></textarea>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="/gestion/pedidos" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>
                                <span th:text="${pedido.idPedido != null ? 'Actualizar' : 'Guardar'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Calcular total automáticamente
        document.getElementById('subtotal').addEventListener('input', calcularTotal);
        document.getElementById('costoEnvio').addEventListener('input', calcularTotal);
        
        function calcularTotal() {
            const subtotal = parseFloat(document.getElementById('subtotal').value) || 0;
            const costoEnvio = parseFloat(document.getElementById('costoEnvio').value) || 0;
            const impuesto = subtotal * 0.18; // 18% IGV
            const total = subtotal + impuesto + costoEnvio;
            document.getElementById('total').value = total.toFixed(2);
        }
    </script>
</body>
</html>
