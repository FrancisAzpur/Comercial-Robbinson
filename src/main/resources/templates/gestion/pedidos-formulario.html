<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: 600;
            color: var(--dark-blue);
        }
        .form-control:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 0.2rem rgba(224, 122, 95, 0.25);
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-primary:hover {
            background-color: #c95e4a;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/pedidos">
                            <i class="fas fa-arrow-left me-1"></i>Volver
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1 class="fw-bold mb-4" style="color: #8d5524;">
                    <i class="fas fa-shopping-cart me-2"></i><span th:text="${titulo}"></span>
                </h1>

                <div class="form-section">
                    <!-- th:action genera la URL POST correcta según si es nuevo o actualizar -->
                    <!-- th:object vincula el objeto pedido del modelo al formulario -->
                    <form th:action="${pedido.id != null ? '/gestion/pedidos/' + pedido.id + '/actualizar' : '/gestion/pedidos/guardar'}" 
                          method="POST" th:object="${pedido}">
                        
                        <div class="row">
                            <!-- Número de Orden: Campo de texto para referencia del pedido -->
                            <div class="col-md-6 mb-3">
                                <label for="numeroOrden" class="form-label">Número de Orden <span class="text-danger">*</span></label>
                                <!-- th:field vincula el campo al atributo numeroOrden del pedido -->
                                <input type="text" class="form-control" id="numeroOrden" th:field="*{numeroOrden}" 
                                       placeholder="Ej: ORD-001" required>
                            </div>

                            <!-- ID del Cliente -->
                            <div class="col-md-6 mb-3">
                                <label for="clienteId" class="form-label">ID Cliente <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="clienteId" th:field="*{clienteId}" required>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Total del Pedido en Soles -->
                            <div class="col-md-6 mb-3">
                                <label for="totalMoneda" class="form-label">Total (S/.) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="totalMoneda" th:field="*{totalMoneda}" 
                                       step="0.01" placeholder="0.00" required>
                            </div>

                            <!-- Estado del Pedido -->
                            <div class="col-md-6 mb-3">
                                <label for="estado" class="form-label">Estado <span class="text-danger">*</span></label>
                                <!-- select con options para seleccionar el estado -->
                                <select class="form-select" id="estado" th:field="*{estado}" required>
                                    <option value="">Seleccionar estado...</option>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Procesando">Procesando</option>
                                    <option value="Enviado">Enviado</option>
                                    <option value="Entregado">Entregado</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Método de Pago -->
                            <div class="col-md-6 mb-3">
                                <label for="metodoPago" class="form-label">Método de Pago <span class="text-danger">*</span></label>
                                <select class="form-select" id="metodoPago" th:field="*{metodoPago}" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="Efectivo">Efectivo</option>
                                    <option value="Tarjeta">Tarjeta de Crédito</option>
                                    <option value="Transferencia">Transferencia Bancaria</option>
                                    <option value="Cheque">Cheque</option>
                                </select>
                            </div>
                        </div>

                        <!-- Descripción de Productos -->
                        <div class="mb-3">
                            <label for="descripcionProductos" class="form-label">Descripción de Productos <span class="text-danger">*</span></label>
                            <!-- textarea para ingresar múltiples líneas -->
                            <textarea class="form-control" id="descripcionProductos" th:field="*{descripcionProductos}" 
                                      rows="4" placeholder="Describe los productos incluidos en el pedido..." required></textarea>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="/gestion/pedidos" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>
                                <!-- Mostrar texto dinámico según si es nuevo o actualizar -->
                                <span th:text="${pedido.id != null ? 'Actualizar' : 'Guardar'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
