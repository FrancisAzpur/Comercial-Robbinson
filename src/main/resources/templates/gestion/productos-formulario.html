<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: 600;
            color: var(--dark-blue);
        }
        .form-control:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 0.2rem rgba(224, 122, 95, 0.25);
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-primary:hover {
            background-color: #c95e4a;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/productos">
                            <i class="fas fa-arrow-left me-1"></i>Volver
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-10 offset-md-1">
                <h1 class="fw-bold mb-4" style="color: #8d5524;">
                    <i class="fas fa-box me-2"></i><span th:text="${titulo}"></span>
                </h1>

                <div class="form-section">
                    <form th:action="${producto.idProducto != null ? '/gestion/productos/' + producto.idProducto + '/actualizar' : '/gestion/productos/guardar'}" 
                          method="POST" th:object="${producto}">
                        
                        <div class="row">
                            <!-- Código de Producto -->
                            <div class="col-md-4 mb-3">
                                <label for="codigoProducto" class="form-label">Código <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="codigoProducto" th:field="*{codigoProducto}" 
                                       placeholder="Ej: PROD-001" required>
                            </div>

                            <!-- Nombre del Producto -->
                            <div class="col-md-8 mb-3">
                                <label for="nombreProducto" class="form-label">Nombre del Producto <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nombreProducto" th:field="*{nombreProducto}" 
                                       placeholder="Nombre completo del producto" required>
                            </div>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" th:field="*{descripcion}" 
                                      rows="3" placeholder="Descripción detallada del producto..."></textarea>
                        </div>

                        <div class="row">
                            <!-- Precio de Compra -->
                            <div class="col-md-3 mb-3">
                                <label for="precioCompra" class="form-label">Precio Compra (S/.) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="precioCompra" th:field="*{precioCompra}" 
                                       step="0.01" placeholder="0.00" required>
                            </div>

                            <!-- Precio de Venta -->
                            <div class="col-md-3 mb-3">
                                <label for="precioVenta" class="form-label">Precio Venta (S/.) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="precioVenta" th:field="*{precioVenta}" 
                                       step="0.01" placeholder="0.00" required>
                            </div>

                            <!-- Stock Actual -->
                            <div class="col-md-3 mb-3">
                                <label for="stockActual" class="form-label">Stock Actual <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="stockActual" th:field="*{stockActual}" 
                                       placeholder="0" required>
                            </div>

                            <!-- Stock Mínimo -->
                            <div class="col-md-3 mb-3">
                                <label for="stockMinimo" class="form-label">Stock Mínimo</label>
                                <input type="number" class="form-control" id="stockMinimo" th:field="*{stockMinimo}" 
                                       placeholder="5">
                            </div>
                        </div>

                        <div class="row">
                            <!-- Etiqueta -->
                            <div class="col-md-4 mb-3">
                                <label for="etiqueta" class="form-label">Etiqueta</label>
                                <select class="form-select" id="etiqueta" th:field="*{etiqueta}">
                                    <option value="">Sin etiqueta</option>
                                    <option value="NUEVO">Nuevo</option>
                                    <option value="OFERTA">Oferta</option>
                                    <option value="DESTACADO">Destacado</option>
                                    <option value="AGOTANDOSE">Agotándose</option>
                                </select>
                            </div>

                            <!-- Imagen Principal -->
                            <div class="col-md-8 mb-3">
                                <label for="imagenPrincipal" class="form-label">URL de Imagen</label>
                                <input type="text" class="form-control" id="imagenPrincipal" th:field="*{imagenPrincipal}" 
                                       placeholder="/img/nombre_imagen.jpg">
                            </div>
                        </div>

                        <!-- Campo Activo -->
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
                                <label class="form-check-label" for="activo">Producto Activo</label>
                            </div>
                        </div>

                        <!-- Margen de utilidad (solo lectura) -->
                        <div class="mb-4 p-3 bg-light rounded" th:if="${producto.idProducto != null}">
                            <h6 class="mb-2">Información adicional</h6>
                            <p class="mb-0">
                                <strong>Margen de Utilidad:</strong> 
                                <span th:text="${#numbers.formatDecimal(producto.margenUtilidad, 1, 2)}">0.00</span>%
                            </p>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="/gestion/productos" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>
                                <span th:text="${producto.idProducto != null ? 'Actualizar' : 'Guardar'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
