<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.85) !important;
        }
        .nav-link:hover {
            color: var(--accent-orange) !important;
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-primary:hover {
            background-color: #c95e4a;
        }
        .badge-pendiente {
            background-color: #ffc107;
            color: #000;
        }
        .badge-procesando {
            background-color: #17a2b8;
        }
        .badge-enviado {
            background-color: #6f42c1;
        }
        .badge-entregado {
            background-color: #28a745;
        }
        .stats-card {
            border-radius: 10px;
            padding: 1.5rem;
            color: white;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/dashboard">
                            <i class="fas fa-chart-line me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/clientes">
                            <i class="fas fa-users me-1"></i>Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/gestion/pedidos">
                            <i class="fas fa-shopping-cart me-1"></i>Pedidos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/ventas">
                            <i class="fas fa-cash-register me-1"></i>Ventas
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-5">
        <div class="row mb-4">
            <div class="col-md-6">
                <h1 class="fw-bold" style="color: #8d5524;">
                    <i class="fas fa-shopping-cart me-2"></i>Gestión de Pedidos
                </h1>
            </div>
            <div class="col-md-6 text-end">
                <a href="/gestion/pedidos/nuevo" class="btn btn-primary btn-lg">
                    <i class="fas fa-plus me-2"></i>Nuevo Pedido
                </a>
            </div>
        </div>

        <!-- Estadísticas de pedidos por estado -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stats-card" style="background-color: #ffc107;">
                    <h3 th:text="${totalPendiente}">0</h3>
                    <p>Pendientes</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card" style="background-color: #17a2b8;">
                    <h3 th:text="${totalProcesando}">0</h3>
                    <p>Procesando</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card" style="background-color: #6f42c1;">
                    <h3 th:text="${totalEnviado}">0</h3>
                    <p>Enviados</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card" style="background-color: #28a745;">
                    <h3 th:text="${totalEntregado}">0</h3>
                    <p>Entregados</p>
                </div>
            </div>
        </div>

        <!-- Tabla de pedidos -->
        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">
                            <!-- th:text muestra el total de pedidos -->
                            <i class="fas fa-list me-2"></i>Listado de Pedidos
                            <span class="badge bg-info float-end" th:text="'Total: ' + ${#lists.size(pedidos)}"></span>
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <!-- th:unless verifica si la lista NO está vacía (opuesto a th:if) -->
                        <div th:if="${pedidos.isEmpty()}" class="alert alert-warning m-3">
                            <i class="fas fa-info-circle me-2"></i>No hay pedidos registrados
                        </div>

                        <!-- th:each itera sobre la lista de pedidos -->
                        <table class="table table-hover mb-0" th:unless="${pedidos.isEmpty()}">
                            <thead class="table-light">
                                <tr>
                                    <th>Número Orden</th>
                                    <th>Cliente ID</th>
                                    <th>Total (S/.)</th>
                                    <th>Estado</th>
                                    <th>Método Pago</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- th:each: itera cada pedido de la lista pedidos -->
                                <tr th:each="pedido : ${pedidos}">
                                    <!-- th:text: muestra el valor del atributo del pedido -->
                                    <td><strong th:text="${pedido.numeroOrden}"></strong></td>
                                    <td th:text="${pedido.clienteId}"></td>
                                    <!-- th:text con formato de número: muestra el precio en soles -->
                                    <td th:text="${#numbers.formatDecimal(pedido.totalMoneda, 1, 2, true)}"></td>
                                    <td>
                                        <!-- th:classappend añade clases CSS dinámicamente según el valor -->
                                        <span th:classappend="'badge badge-' + ${pedido.estado.toLowerCase()}" 
                                              th:text="${pedido.estado}"></span>
                                    </td>
                                    <td th:text="${pedido.metodoPago}"></td>
                                    <td>
                                        <!-- th:href genera URLs dinámicas con parámetros -->
                                        <a class="btn btn-sm btn-info" th:href="@{/gestion/pedidos/{id}(id=${pedido.id})}">
                                            <i class="fas fa-eye"></i> Ver
                                        </a>
                                        <a class="btn btn-sm btn-warning" th:href="@{/gestion/pedidos/{id}/editar(id=${pedido.id})}">
                                            <i class="fas fa-edit"></i> Editar
                                        </a>
                                        <a class="btn btn-sm btn-danger" th:href="@{/gestion/pedidos/{id}/eliminar(id=${pedido.id})}"
                                           onclick="return confirm('¿Eliminar este pedido?')">
                                            <i class="fas fa-trash"></i> Eliminar
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
