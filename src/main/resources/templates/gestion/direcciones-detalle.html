<!--
=========================================================================
DETALLE DE DIRECCIÓN - direcciones-detalle.html
=========================================================================
PUNTO DE EVALUACIÓN: CRUD (Read) + Consulta multi-tabla + Thymeleaf

CONSULTA MULTI-TABLA:
  Dirección → Cliente (muestra nombre del dueño de la dirección)

THYMELEAF:
  th:text="${direccion.cliente.nombreCompleto}"  → Navega relación JPA
  th:text="${direccion.direccion}"                → Datos de la dirección
  th:if="${direccion.esPrincipal}"                → Marca de principal

BOOTSTRAP: detail-card, badge, btn-primary
=========================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Detalle Dirección</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .detail-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        .detail-label {
            font-weight: 600;
            color: var(--dark-blue);
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-primary:hover {
            background-color: #c95e4a;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/direcciones">
                            <i class="fas fa-arrow-left me-1"></i>Volver al Listado
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1 class="fw-bold mb-4" style="color: #8d5524;">
                    <i class="fas fa-map-marker-alt me-2"></i>Detalle de la Dirección
                </h1>

                <div class="detail-card">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">ID Dirección:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:text="${direccion.idDireccion}"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">Cliente:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:text="${direccion.cliente.nombreCompleto}"></span>
                            <small class="text-muted" th:text="'(' + ${direccion.cliente.correoElectronico} + ')'"></small>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">Alias:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:text="${direccion.alias} ?: 'Sin alias'"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">Dirección:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:text="${direccion.direccion}"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">Referencia:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:text="${direccion.referencia} ?: 'Sin referencia'"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">Distrito:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:text="${direccion.distrito} ?: 'No registrado'"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">Provincia:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:text="${direccion.provincia} ?: 'No registrado'"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">Departamento:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:text="${direccion.departamento} ?: 'No registrado'"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">Código Postal:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:text="${direccion.codigoPostal} ?: 'No registrado'"></span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <span class="detail-label">Tipo:</span>
                        </div>
                        <div class="col-md-8">
                            <span th:if="${direccion.esPrincipal}" class="badge bg-success">
                                <i class="fas fa-star me-1"></i>Dirección Principal
                            </span>
                            <span th:unless="${direccion.esPrincipal}" class="badge bg-secondary">Dirección Secundaria</span>
                        </div>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">
                        <a href="/gestion/direcciones" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Volver
                        </a>
                        <div>
                            <a th:href="@{/gestion/direcciones/{id}/editar(id=${direccion.idDireccion})}" class="btn btn-warning">
                                <i class="fas fa-edit me-2"></i>Editar
                            </a>
                            <a th:href="@{/gestion/direcciones/{id}/eliminar(id=${direccion.idDireccion})}" class="btn btn-danger"
                               onclick="return confirm('¿Estás seguro de eliminar esta dirección?')">
                                <i class="fas fa-trash me-2"></i>Eliminar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
