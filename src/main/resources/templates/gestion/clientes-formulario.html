<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Cliente</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: 600;
            color: var(--dark-blue);
            margin-bottom: 0.5rem;
        }
        .form-control:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 0.2rem rgba(224, 122, 95, 0.25);
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-primary:hover {
            background-color: #c95e4a;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/clientes">
                            <i class="fas fa-arrow-left me-1"></i>Volver
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1 class="fw-bold mb-4" style="color: #8d5524;">
                    <i class="fas fa-user me-2"></i><span th:text="${titulo}"></span>
                </h1>

                <div class="form-section">
                    <!-- Formulario con th:action para enviar a la ruta correspondiente -->
                    <!-- th:object vincula el objeto cliente del modelo al formulario -->
                    <!-- th:field vincula cada campo del formulario con los atributos del cliente -->
                    <form th:action="${cliente.id != null ? '/gestion/clientes/' + cliente.id + '/actualizar' : '/gestion/clientes/guardar'}" 
                          method="POST" th:object="${cliente}">
                        
                        <div class="row">
                            <!-- Campo Nombre: th:field="*{nombre}" vincula al atributo nombre del cliente -->
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                            </div>

                            <!-- Campo Apellido -->
                            <div class="col-md-6 mb-3">
                                <label for="apellido" class="form-label">Apellido <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Campo Email -->
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" 
                                       pattern="[a-zA-Z0-9._%+-]+@(gmail|outlook|hotmail|yahoo|icloud|live)\.(com|es|pe)" 
                                       title="Ingrese un email válido (gmail, outlook, hotmail, yahoo, icloud, live)" required>
                            </div>

                            <!-- Campo Teléfono -->
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label">Teléfono <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="telefono" th:field="*{telefono}" 
                                       pattern="9[0-9]{8}" maxlength="9"
                                       title="El teléfono debe tener 9 dígitos y empezar con 9" required>
                            </div>
                        </div>

                        <!-- Campo Dirección -->
                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="direccion" th:field="*{direccion}" required>
                        </div>

                        <div class="row">
                            <!-- Campo Ciudad -->
                            <div class="col-md-6 mb-3">
                                <label for="ciudad" class="form-label">Ciudad <span class="text-danger">*</span></label>
                                <select class="form-control" id="ciudad" th:field="*{ciudad}" required>
                                    <option value="">Seleccione una ciudad</option>
                                    <option value="Lima">Lima</option>
                                    <option value="Arequipa">Arequipa</option>
                                    <option value="Cusco">Cusco</option>
                                    <option value="Trujillo">Trujillo</option>
                                    <option value="Chiclayo">Chiclayo</option>
                                    <option value="Piura">Piura</option>
                                    <option value="Iquitos">Iquitos</option>
                                    <option value="Huancayo">Huancayo</option>
                                    <option value="Tacna">Tacna</option>
                                    <option value="Ica">Ica</option>
                                    <option value="Pucallpa">Pucallpa</option>
                                    <option value="Cajamarca">Cajamarca</option>
                                    <option value="Ayacucho">Ayacucho</option>
                                    <option value="Puno">Puno</option>
                                    <option value="Chimbote">Chimbote</option>
                                    <option value="Tarapoto">Tarapoto</option>
                                    <option value="Huánuco">Huánuco</option>
                                    <option value="Juliaca">Juliaca</option>
                                    <option value="Sullana">Sullana</option>
                                    <option value="Tumbes">Tumbes</option>
                                </select>
                            </div>

                            <!-- Campo Código Postal -->
                            <div class="col-md-6 mb-3">
                                <label for="codigoPostal" class="form-label">Código Postal <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="codigoPostal" th:field="*{codigoPostal}" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="/gestion/clientes" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>
                                <span th:text="${cliente.id != null ? 'Actualizar' : 'Guardar'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
