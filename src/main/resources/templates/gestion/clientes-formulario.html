<!--
=========================================================================
FORMULARIO DE CLIENTES - clientes-formulario.html
=========================================================================
PUNTO DE EVALUACIÓN: CRUD (Create/Update) + Lista desplegable + Bootstrap

COMANDOS THYMELEAF:
  th:object="${cliente}"              → Vincula formulario al objeto Cliente
  th:action (dinámico)                → Crea nuevo o actualiza existente
  th:field="*{nombreCompleto}"        → Binding bidireccional
  th:if="${cliente.idCliente == null}"→ Condicional: solo muestra contraseña para nuevos
  th:each para TipoDocumento          → Lista desplegable de tipos de documento

LISTA DESPLEGABLE:
  <select> Tipo Documento: DNI, RUC, PASAPORTE (Enum de la entidad Cliente)

BOOTSTRAP: form-control, form-select, form-check form-switch, btn-primary
=========================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Cliente</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: 600;
            color: var(--dark-blue);
            margin-bottom: 0.5rem;
        }
        .form-control:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 0.2rem rgba(224, 122, 95, 0.25);
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .btn-primary:hover {
            background-color: #c95e4a;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/clientes">
                            <i class="fas fa-arrow-left me-1"></i>Volver
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1 class="fw-bold mb-4" style="color: #8d5524;">
                    <i class="fas fa-user me-2"></i><span th:text="${titulo}"></span>
                </h1>

                <div class="form-section">
                    <!-- Formulario conectado a la BD via th:object -->
                    <form th:action="${cliente.idCliente != null ? '/gestion/clientes/' + cliente.idCliente + '/actualizar' : '/gestion/clientes/guardar'}" 
                          method="POST" th:object="${cliente}">
                        
                        <div class="row">
                            <!-- Campo Nombre Completo -->
                            <div class="col-md-12 mb-3">
                                <label for="nombreCompleto" class="form-label">Nombre Completo <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nombreCompleto" th:field="*{nombreCompleto}" 
                                       placeholder="Ingrese nombre completo" required>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Campo Correo Electrónico -->
                            <div class="col-md-6 mb-3">
                                <label for="correoElectronico" class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="correoElectronico" th:field="*{correoElectronico}" 
                                       placeholder="ejemplo@correo.com" required>
                            </div>

                            <!-- Campo Teléfono -->
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" th:field="*{telefono}" 
                                       pattern="9[0-9]{8}" maxlength="9" placeholder="987654321"
                                       title="El teléfono debe tener 9 dígitos y empezar con 9">
                            </div>
                        </div>

                        <div class="row">
                            <!-- Campo Tipo Documento -->
                            <div class="col-md-6 mb-3">
                                <label for="tipoDocumento" class="form-label">Tipo de Documento</label>
                                <select class="form-select" id="tipoDocumento" th:field="*{tipoDocumento}">
                                    <option value="DNI">DNI</option>
                                    <option value="RUC">RUC</option>
                                    <option value="PASAPORTE">Pasaporte</option>
                                </select>
                            </div>

                            <!-- Campo Documento Identidad -->
                            <div class="col-md-6 mb-3">
                                <label for="documentoIdentidad" class="form-label">Número de Documento</label>
                                <input type="text" class="form-control" id="documentoIdentidad" th:field="*{documentoIdentidad}" 
                                       placeholder="Número de documento">
                            </div>
                        </div>

                        <!-- Campo Contraseña (solo para nuevo cliente) -->
                        <div class="mb-3" th:if="${cliente.idCliente == null}">
                            <label for="contrasenaHash" class="form-label">Contraseña <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="contrasenaHash" th:field="*{contrasenaHash}" 
                                   placeholder="Ingrese contraseña" required>
                        </div>

                        <!-- Campo Activo -->
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
                                <label class="form-check-label" for="activo">Cliente Activo</label>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="/gestion/clientes" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>
                                <span th:text="${cliente.idCliente != null ? 'Actualizar' : 'Guardar'}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
