<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Detalle Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .detail-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        .detail-label {
            font-weight: 600;
            color: var(--dark-blue);
        }
        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }
        .producto-imagen {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/productos">
                            <i class="fas fa-arrow-left me-1"></i>Volver al Listado
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-10 offset-md-1">
                <h1 class="fw-bold mb-4" style="color: #8d5524;">
                    <i class="fas fa-box me-2"></i>Detalle del Producto
                </h1>

                <div class="detail-card">
                    <div class="row">
                        <!-- Imagen del producto -->
                        <div class="col-md-4 text-center mb-4">
                            <img th:if="${producto.imagenPrincipal}" 
                                 th:src="${producto.imagenPrincipal}" 
                                 alt="Producto" class="producto-imagen">
                            <div th:unless="${producto.imagenPrincipal}" class="text-muted p-5 bg-light rounded">
                                <i class="fas fa-image fa-4x"></i>
                                <p class="mt-2">Sin imagen</p>
                            </div>
                        </div>

                        <!-- Detalles del producto -->
                        <div class="col-md-8">
                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Código:</span></div>
                                <div class="col-md-8"><span th:text="${producto.codigoProducto}"></span></div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Nombre:</span></div>
                                <div class="col-md-8"><strong th:text="${producto.nombreProducto}"></strong></div>
                            </div>

                            <div class="row mb-3" th:if="${producto.descripcion}">
                                <div class="col-md-4"><span class="detail-label">Descripción:</span></div>
                                <div class="col-md-8"><span th:text="${producto.descripcion}"></span></div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Precio Compra:</span></div>
                                <div class="col-md-8">S/. <span th:text="${#numbers.formatDecimal(producto.precioCompra, 1, 2)}"></span></div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Precio Venta:</span></div>
                                <div class="col-md-8"><strong>S/. <span th:text="${#numbers.formatDecimal(producto.precioVenta, 1, 2)}"></span></strong></div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Margen Utilidad:</span></div>
                                <div class="col-md-8">
                                    <span class="badge bg-success" th:text="${#numbers.formatDecimal(producto.margenUtilidad, 1, 2)} + '%'"></span>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Stock Actual:</span></div>
                                <div class="col-md-8">
                                    <span th:if="${producto.stockActual <= producto.stockMinimo}" class="text-danger fw-bold">
                                        <i class="fas fa-exclamation-triangle"></i> 
                                        <span th:text="${producto.stockActual}"></span> (Stock bajo)
                                    </span>
                                    <span th:unless="${producto.stockActual <= producto.stockMinimo}" th:text="${producto.stockActual}"></span>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Stock Mínimo:</span></div>
                                <div class="col-md-8"><span th:text="${producto.stockMinimo}"></span></div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Etiqueta:</span></div>
                                <div class="col-md-8">
                                    <span th:if="${producto.etiqueta}" class="badge bg-info" th:text="${producto.etiqueta}"></span>
                                    <span th:unless="${producto.etiqueta}" class="text-muted">Sin etiqueta</span>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Estado:</span></div>
                                <div class="col-md-8">
                                    <span th:if="${producto.activo}" class="badge bg-success">Activo</span>
                                    <span th:unless="${producto.activo}" class="badge bg-danger">Inactivo</span>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4"><span class="detail-label">Fecha Registro:</span></div>
                                <div class="col-md-8">
                                    <span th:text="${#temporals.format(producto.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between">
                        <a href="/gestion/productos" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Volver
                        </a>
                        <div>
                            <a th:href="@{/gestion/productos/{id}/editar(id=${producto.idProducto})}" class="btn btn-warning">
                                <i class="fas fa-edit me-2"></i>Editar
                            </a>
                            <a th:href="@{/gestion/productos/{id}/eliminar(id=${producto.idProducto})}" class="btn btn-danger"
                               onclick="return confirm('¿Estás seguro de eliminar este producto?')">
                                <i class="fas fa-trash me-2"></i>Eliminar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
