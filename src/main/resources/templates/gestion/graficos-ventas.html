<!--
=========================================================================
GRÁFICOS DE VENTAS - graficos-ventas.html
=========================================================================
PUNTO DE EVALUACIÓN: Consultas multi-tabla + Chart.js + Thymeleaf

CONSULTAS MULTI-TABLA (4 TABLAS):
  Pedido → DetallePedido → Producto (ventas por producto)
  Pedido → Cliente (ventas por cliente/vendedor)
  Datos: ventasPorProducto, ventasPorFecha, ventasPorVendedor

THYMELEAF: th:text para estadísticas, th:each implícito via Maps en JS
CHART.JS: Gráficos de barras, líneas y donut con datos dinámicos
=========================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos de Ventas - Comercial Robinson</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js para crear gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        :root {
            --beige: #FDFBF7;
            --dark-blue: #0d1b2a;
            --medium-blue: #1b263b;
            --accent-orange: #e07a5f;
            --text-dark: #2d2d2d;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
        }
        .navbar {
            background: linear-gradient(90deg, var(--medium-blue), var(--dark-blue));
        }
        .navbar-brand {
            font-weight: 800;
            color: white !important;
        }
        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            border-top: 4px solid var(--accent-orange);
        }
        .chart-title {
            font-weight: 700;
            color: var(--dark-blue);
            margin-bottom: 1.5rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-box {
            background: linear-gradient(135deg, var(--medium-blue), var(--dark-blue));
            color: white;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-orange);
        }
        .stat-label {
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- Navbar de navegación -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store me-2"></i>Comercial Robinson
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/dashboard">
                            <i class="fas fa-chart-line me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/gestion/ventas">
                            <i class="fas fa-cash-register me-1"></i>Ventas
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-5">
        <h1 class="fw-bold mb-5" style="color: #8d5524;">
            <i class="fas fa-chart-pie me-2"></i>Análisis de Ventas
        </h1>

        <!-- Estadísticas principales -->
        <!-- Tarjetas con datos resumidos de ventas -->
        <div class="stats-grid">
            <div class="stat-box">
                <i class="fas fa-shopping-cart fa-2x mb-2" style="color: var(--accent-orange);"></i>
                <div class="stat-label">Total de Ventas</div>
                <div class="stat-value" th:text="${totalVentas}">0</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-money-bill fa-2x mb-2" style="color: var(--accent-orange);"></i>
                <div class="stat-label">Total Ingresos</div>
                <div class="stat-value">
                    <!-- th:text formatea el monto total con 2 decimales y símbolo de soles -->
                    S/. <span th:text="${#numbers.formatDecimal(totalMonto, 1, 2, true)}">0.00</span>
                </div>
            </div>
            <div class="stat-box">
                <i class="fas fa-cube fa-2x mb-2" style="color: var(--accent-orange);"></i>
                <div class="stat-label">Unidades Vendidas</div>
                <div class="stat-value" th:text="${totalUnidades}">0</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-calculator fa-2x mb-2" style="color: var(--accent-orange);"></i>
                <div class="stat-label">Promedio por Venta</div>
                <div class="stat-value">
                    <!-- Calcula el promedio dividiendo total monto entre cantidad de ventas -->
                    S/. <span th:text="${#numbers.formatDecimal(promedio, 1, 2, true)}">0.00</span>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Gráfico de Barras: Ventas por Producto -->
            <!-- Chart.js interpreta el canvas con id="ventasProductoChart" para crear el gráfico -->
            <div class="col-lg-6">
                <div class="chart-card">
                    <h5 class="chart-title">
                        <i class="fas fa-chart-bar me-2"></i>Ventas por Producto (Barras)
                    </h5>
                    <canvas id="ventasProductoChart"></canvas>
                </div>
            </div>

            <!-- Gráfico Circular: Distribución de Productos -->
            <!-- El gráfico pie/doughnut muestra la proporción de cada producto en las ventas -->
            <div class="col-lg-6">
                <div class="chart-card">
                    <h5 class="chart-title">
                        <i class="fas fa-chart-pie me-2"></i>Distribución de Productos (Circular)
                    </h5>
                    <canvas id="distribucionProductoChart"></canvas>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <!-- Gráfico de Línea: Tendencia de Ventas por Fecha -->
            <!-- La línea muestra cómo evolucionan las ventas a lo largo del tiempo -->
            <div class="col-lg-12">
                <div class="chart-card">
                    <h5 class="chart-title">
                        <i class="fas fa-chart-line me-2"></i>Tendencia de Ventas (Línea)
                    </h5>
                    <canvas id="tendenciaVentasChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Gráfico de Barras: Vendedores con Mayor Desempeño -->
        <div class="row mt-4">
            <div class="col-lg-12">
                <div class="chart-card">
                    <h5 class="chart-title">
                        <i class="fas fa-user-tie me-2"></i>Desempeño por Vendedor (Barras)
                    </h5>
                    <canvas id="vendedorChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
        // Datos enviados desde el controlador (Thymeleaf inline expression)
        // Estos valores se generan a partir de las ventas en el servidor
        const ventasPorProducto = /*[[${ventasPorProducto}]]*/ {};
        const ventasPorFecha = /*[[${ventasPorFecha}]]*/ {};
        const ventasPorVendedor = /*[[${ventasPorVendedor}]]*/ {};

        // Colores para los gráficos
        const coloresGraficos = [
            'rgba(224, 122, 95, 0.8)',      // Naranja principal
            'rgba(13, 27, 42, 0.8)',        // Azul oscuro
            'rgba(27, 38, 59, 0.8)',        // Azul medio
            'rgba(253, 251, 247, 0.8)',     // Beige
            'rgba(45, 45, 45, 0.8)'         // Gris oscuro
        ];

        // ========== GRÁFICO 1: Ventas por Producto (Barras) ==========
        // Este gráfico de barras muestra cuántas unidades se vendieron de cada producto
        const ctxProducto = document.getElementById('ventasProductoChart').getContext('2d');
        new Chart(ctxProducto, {
            type: 'bar',  // Tipo: gráfico de barras
            data: {
                labels: Object.keys(ventasPorProducto),  // Nombres de los productos
                datasets: [{
                    label: 'Unidades Vendidas',
                    data: Object.values(ventasPorProducto),  // Cantidad vendida de cada producto
                    backgroundColor: coloresGraficos[0],  // Color de las barras (naranja)
                    borderColor: 'rgba(224, 122, 95, 1)',
                    borderWidth: 2,
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { font: { family: "'Poppins', sans-serif" } }
                    }
                },
                scales: {
                    y: { beginAtZero: true }  // Eje Y comienza en 0
                }
            }
        });

        // ========== GRÁFICO 2: Distribución de Productos (Circular/Pie) ==========
        // Este gráfico circular muestra la proporción de cada producto respecto al total
        const ctxDistribucion = document.getElementById('distribucionProductoChart').getContext('2d');
        new Chart(ctxDistribucion, {
            type: 'doughnut',  // Tipo: gráfico circular con agujero en el centro
            data: {
                labels: Object.keys(ventasPorProducto),  // Nombres de productos
                datasets: [{
                    data: Object.values(ventasPorProducto),  // Cantidad de cada producto
                    backgroundColor: [
                        'rgba(224, 122, 95, 0.8)',      // Naranja
                        'rgba(13, 27, 42, 0.8)',        // Azul oscuro
                        'rgba(27, 38, 59, 0.8)',        // Azul medio
                        'rgba(141, 85, 36, 0.8)',       // Marrón
                        'rgba(45, 45, 45, 0.8)'         // Gris
                    ],
                    borderColor: 'white',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',  // Posición de la leyenda
                        labels: { font: { family: "'Poppins', sans-serif" } }
                    }
                }
            }
        });

        // ========== GRÁFICO 3: Tendencia de Ventas (Línea) ==========
        // Este gráfico de línea muestra cómo evolucionan las ventas en el tiempo
        const ctxTendencia = document.getElementById('tendenciaVentasChart').getContext('2d');
        new Chart(ctxTendencia, {
            type: 'line',  // Tipo: gráfico de línea
            data: {
                labels: Object.keys(ventasPorFecha),  // Fechas
                datasets: [{
                    label: 'Ventas Diarias',
                    data: Object.values(ventasPorFecha),  // Montos por fecha
                    borderColor: 'rgba(224, 122, 95, 1)',  // Color de la línea (naranja)
                    backgroundColor: 'rgba(224, 122, 95, 0.1)',  // Área bajo la línea
                    fill: true,
                    tension: 0.4,  // Suavidad de la curva
                    pointRadius: 5,
                    pointBackgroundColor: 'rgba(224, 122, 95, 1)',
                    pointBorderColor: 'white',
                    pointBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { font: { family: "'Poppins', sans-serif" } }
                    }
                },
                scales: {
                    y: { beginAtZero: true }  // Eje Y comienza en 0
                }
            }
        });

        // ========== GRÁFICO 4: Desempeño por Vendedor (Barras) ==========
        // Este gráfico de barras horizontales muestra el monto total vendido por cada vendedor
        const ctxVendedor = document.getElementById('vendedorChart').getContext('2d');
        new Chart(ctxVendedor, {
            type: 'bar',  // Tipo: gráfico de barras
            data: {
                labels: Object.keys(ventasPorVendedor),  // Nombres de vendedores
                datasets: [{
                    label: 'Monto Total Vendido (S/.)',
                    data: Object.values(ventasPorVendedor),  // Monto por vendedor
                    backgroundColor: 'rgba(13, 27, 42, 0.8)',  // Azul oscuro
                    borderColor: 'rgba(13, 27, 42, 1)',
                    borderWidth: 2,
                    borderRadius: 5
                }]
            },
            options: {
                indexAxis: 'y',  // Hace que las barras sean horizontales
                responsive: true,
                plugins: {
                    legend: {
                        labels: { font: { family: "'Poppins', sans-serif" } }
                    }
                },
                scales: {
                    x: { beginAtZero: true }  // Eje X comienza en 0
                }
            }
        });
    </script>
</body>
</html>
