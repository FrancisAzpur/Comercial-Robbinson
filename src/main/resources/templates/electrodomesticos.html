<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Electrodomésticos')}"></head>

<body>
    <!-- Header -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- Margen superior para navbar fija -->
    <div style="margin-top: 70px;">

    <!-- Header de Electrodomésticos -->
    <section class="hero py-2" style="min-height: 50vh;">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-12 text-center hero-content">
                    <h1 class="display-3 fw-bold">ELECTRODOMÉSTICOS</h1>
                    <p class="lead mb-4">Toda la tecnología para tu hogar en un solo lugar</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Catálogo de Productos -->
    <section class="container-fluid py-5">
        <div class="row">
            <!-- SIDEBAR -->
            <aside class="col-md-3 col-lg-2 border-end p-4">
                <h5 class="fw-bold mb-4">Electrodomésticos</h5>

                <div class="mb-4">
                    <h6 class="fw-semibold mb-2">Categorías</h6>
                    <ul class="list-unstyled category-list">
                        <li><button class="category-btn active" data-filter="todos">Todos</button></li>
                        <li><button class="category-btn" data-filter="refrigeracion">Refrigeración</button></li>
                        <li><button class="category-btn" data-filter="lavado">Lavado</button></li>
                        <li><button class="category-btn" data-filter="tv">TV y Audio</button></li>
                        <li><button class="category-btn" data-filter="cocina">Cocina</button></li>
                    </ul>
                </div>
            </aside>

            <!-- PRODUCTOS -->
            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold">Electrodomésticos</h4>
                    <select class="form-select w-auto">
                        <option>Relevancia</option>
                        <option>Menor precio</option>
                        <option>Mayor precio</option>
                    </select>
                </div>

                <div class="row g-4" id="catalogo-productos">
                    <!-- Productos cargados dinámicamente -->
                </div>
            </main>
        </div>
    </section>

    </div>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/footer :: scripts}"></div>
    
    <!-- Script específico de electrodomésticos -->
    <script th:src="@{/js/electrodomesticos.js}"></script>
</body>
</html>
