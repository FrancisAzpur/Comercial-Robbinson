<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">Se produjo un error</h4>
                    </div>
                    <div class="card-body">
                        <p><strong>Hora:</strong> <span th:text="${timestamp}"></span></p>
                        <p><strong>Código:</strong> <span th:text="${status}"></span></p>
                        <p><strong>Mensaje:</strong> <span th:text="${message}"></span></p>
                        <div th:if="${exception}">
                            <p><strong>Excepción:</strong></p>
                            <pre th:text="${exception}"></pre>
                        </div>
                        <a href="/" class="btn btn-primary mt-3">Volver al inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
