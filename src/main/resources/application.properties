# =========================================================================
# CONFIGURACIÓN PRINCIPAL - application.properties
# =========================================================================
# PUNTO DE EVALUACIÓN: Conexión a BDD + Configuración de Thymeleaf
#
# Este archivo configura todo el entorno de Spring Boot:
#   - Conexión a MySQL (robbinson_db)
#   - Motor de templates Thymeleaf
#   - JPA/Hibernate para ORM
#   - Recursos estáticos (CSS, JS, imágenes)
# =========================================================================

spring.application.name=ComRobinson
server.port=8083

# ==================== Configuración de Thymeleaf ====================
# Motor de plantillas HTML que permite usar comandos th:* en los templates
# cache=false: desactiva caché para ver cambios en tiempo real (desarrollo)
# prefix: ubicación de los archivos .html
# mode=HTML: parsea como HTML5
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==================== Recursos estáticos ====================
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ==================== Configuración de Base de Datos ====================
# CONEXIÓN A MYSQL: Usa el driver JDBC de MySQL para conectar
# a la base de datos 'robbinson_db' en localhost:3306
# Spring Data JPA genera las consultas SQL automáticamente
spring.datasource.url=jdbc:mysql://localhost:3306/robbinson_db
spring.datasource.username=root
spring.datasource.password=password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== Configuración de JPA/Hibernate ====================
# ddl-auto=update: Hibernate actualiza las tablas automáticamente
#   según las entidades JPA (@Entity) sin borrar datos existentes
# show-sql=true: Muestra las consultas SQL en la consola (para debug)
# format_sql=true: Formatea las consultas SQL para mejor legibilidad
# dialect: Usa el dialecto específico de MySQL para generar SQL optimizado
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==================== Otras configuraciones ====================
spring.main.banner-mode=console

